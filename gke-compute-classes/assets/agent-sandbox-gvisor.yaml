# EXAMPLE TEMPLATE - DO NOT DEPLOY
#
# ComputeClass and GKE Agent Sandbox manifests using gVisor container sandboxing.
# Provides kernel-level sandboxing (runsc) with sub-second warm pool claiming and
# a hybrid 5-family On-Demand priority ladder to maximize availability.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: agent-sandbox-gvisor
spec:
  nodePoolConfig:
    sandbox:
      type: gvisor
    nodeLabels:
      workload-type: agent-sandbox
  # IMPORTANT: Align machineType / machineFamily with your existing CUDs/Reservations
  priorities:
  # Tier 1: 8-core compute & general-purpose shapes
  - machineType: c4-standard-8
  - machineType: n4-standard-8
  - machineType: c3-standard-8
  - machineType: n4d-standard-8
  - machineType: n2-standard-8
  # Tier 2: 16-core shapes for higher pod packing density
  - machineType: c4-standard-16
  - machineType: n4-standard-16
  - machineType: c3-standard-16
  - machineType: n2-standard-16
  # Tier 3: Bounded family catch-all for broad zone elasticity
  - machineFamily: n2
    minCores: 8
    minMemoryGb: 32
  activeMigration:
    optimizeRulePriority: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
---
# GKE Agent Sandbox: SandboxTemplate, SandboxWarmPool, and SandboxClaim.
# Complies with GKE sandbox-core-policy and sandbox-hardening-policy VAPs.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-agent-gvisor-template
  namespace: default
spec:
  podTemplate:
    metadata:
      labels:
        sandbox-type: python-agent
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
        cloud.google.com/compute-class: agent-sandbox-gvisor
      tolerations:
      - key: sandbox.gke.io/runtime
        operator: Equal
        value: gvisor
        effect: NoSchedule
      restartPolicy: OnFailure
      containers:
      - name: agent-runtime
        image: registry.k8s.io/agent-sandbox/python-runtime-sandbox:v0.1.0
        ports:
        - containerPort: 8888
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: python-agent-warmpool
  namespace: default
spec:
  replicas: 2
  sandboxTemplateRef:
    name: python-agent-gvisor-template
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: agent-session-001
  namespace: default
spec:
  warmPoolRef:
    name: python-agent-warmpool
