# EXAMPLE TEMPLATE - DO NOT DEPLOY
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: balanced-reserved
spec:
  # Multi-zone scale-up across zonal GCE reservations, WITHOUT priorityScore
  # (priorityScore needs GKE 1.35.2-gke.1842000+; these patterns work on older versions).
  #
  # TWO LAYERS OF "BALANCE" (ask the user which they mean):
  #   - INFRASTRUCTURE (nodes): locationPolicy: BALANCED spreads node scale-up roughly
  #     evenly across zones WITHIN A SINGLE MULTI-ZONE NODE POOL (best-effort; still
  #     scales up if a zone is short; ANY packs one zone). It does NOT balance across
  #     separate single-zone node pools.
  #   - WORKLOAD (pods): BALANCED does NOT guarantee even POD distribution. For that,
  #     set pod topologySpreadConstraints on the WORKLOAD (see commented block below).
  #
  # SCHEMA NOTE: location.zones CANNOT be combined with affinity: Specific (error:
  #   "location config with specific reservations enabled"). Zones come ONLY from
  #   reservations.specific[].zones; the location block keeps locationPolicy only.
  # Never split zones into sequential unscored priorities (zone-a drains first).
  nodePoolAutoCreation:
    enabled: true
  priorities:
  # --- OPTION 1A (GKE 1.36.0-gke.3204000+, OPEN RESERVATIONS — 1 MULTI-ZONE POOL) ---
  # No hardcoded reservation names; creates ONE multi-zone NAP node pool so
  # locationPolicy: BALANCED balances nodes across all 3 zones:
  # - machineType: n4-standard-32
  #   spot: false
  #   location:
  #     locationPolicy: BALANCED
  #     zones: ['us-central1-a', 'us-central1-b', 'us-central1-c']
  #   reservations:
  #     affinity: AnyThenFail

  # --- OPTION 1B (SAME-NAMED SPECIFIC RESERVATIONS — 1 MULTI-ZONE POOL, PRE-1.36 OK) ---
  # Create a GCE specific reservation with the EXACT SAME NAME and identical machine
  # properties in every zone, then list all zones in ONE specific[] entry. NAP aggregates
  # them into ONE multi-zone node pool so locationPolicy: BALANCED balances across zones:
  - machineType: n4-standard-32   # IMPORTANT: Align machineFamily/type with your existing CUDs/Reservations
    spot: false
    location:
      locationPolicy: BALANCED      # balances nodes across zones in this multi-zone pool; NO location.zones here
    reservations:
      affinity: Specific            # NEVER AnyBestEffort — it consumes On-Demand capacity before evaluating lower priorities
      specific:
      - name: <SHARED-RESERVATION-NAME>
        zones: ['us-central1-a', 'us-central1-b', 'us-central1-c']

  # --- OPTION 2 (DIFFERENTLY NAMED ZONAL RESERVATIONS — 3 SINGLE-ZONE POOLS) ---
  # If existing reservations have distinct names per zone, list them as separate
  # specific[] entries in ONE priority (avoids sequential zone-a-first draining).
  # IMPORTANT: NAP creates a separate single-zone node pool per specific[] entry, so
  # locationPolicy: BALANCED does NOT balance across them — you MUST pair with pod
  # topologySpreadConstraints below to enforce even zonal spread.
  - machineType: n4-standard-16   # IMPORTANT: Align machineFamily/type with your existing CUDs/Reservations
    spot: false
    location:
      locationPolicy: BALANCED
    reservations:
      affinity: Specific
      specific:
      - name: <RESERVATION-16-ZONE-A>
        zones: ['us-central1-a']
      - name: <RESERVATION-16-ZONE-B>
        zones: ['us-central1-b']
      - name: <RESERVATION-16-ZONE-C>
        zones: ['us-central1-c']

  whenUnsatisfiable: DoNotScaleUp

# ---------------------------------------------------------------------------
# WORKLOAD LAYER — apply to the Pod/Deployment, NOT the ComputeClass.
# Required for even POD spread in ALL cases, and required to drive even zonal
# scale-up across differently named single-zone specific[] reservations (Option 2).
# Without whenUnsatisfiable: DoNotSchedule the scheduler may still pack one zone.
#   spec:
#     template:
#       spec:
#         nodeSelector:
#           cloud.google.com/compute-class: balanced-reserved
#         topologySpreadConstraints:
#         - maxSkew: 1
#           topologyKey: topology.kubernetes.io/zone
#           whenUnsatisfiable: DoNotSchedule
#           labelSelector:
#             matchLabels:
#               app: <YOUR-APP-LABEL>
# ---------------------------------------------------------------------------
